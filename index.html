<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Воздухан — Telegram</title>
  <!-- Umami: подставить свой Website ID из cloud.umami.is -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="ВСТАВИТЬ-ID"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #eef4fb 0%, #dceaf7 100%);
      color: #16202c;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(20, 50, 90, .12);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #5b6b7c;
      margin-bottom: 24px;
    }

    .lead {
      font-weight: 600;
      color: #16202c;
      margin-bottom: 12px;
    }

    .list {
      list-style: none;
      display: inline-block;
      text-align: left;
      margin-bottom: 32px;
    }

    .list li {
      font-size: 16px;
      line-height: 1.9;
      color: #5b6b7c;
    }

    .list li::before {
      content: "▪️";
      margin-right: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #2aabee;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      padding: 15px 32px;
      border-radius: 999px;
      transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
      box-shadow: 0 8px 20px rgba(42, 171, 238, .35);
    }

    .btn:hover {
      background: #1d97d8;
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(42, 171, 238, .45);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(42, 171, 238, .35);
    }

    .btn svg { width: 22px; height: 22px; fill: currentColor; }

    .hint {
      font-size: 14px;
      color: #90a0b0;
      margin: 22px 0 0;
    }

    .hint button {
      font: inherit;
      color: #2aabee;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Воздухан</h1>
    <p>Заробіток в інтернеті як він є — без рожевих окулярів.</p>

    <p class="lead">Що всередині:</p>
    <ul class="list">
      <li>арбітраж трафіку</li>
      <li>крипта</li>
      <li>кейси та особистий досвід</li>
    </ul>

    <a class="btn" id="tg" href="https://t.me/+eh5fYWmZDxxhMjFi" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Перейти в телеграм
    </a>

    <p class="hint">Не відкривається? <button type="button" id="copy">Скопіюйте посилання</button> і вставте його в Telegram.</p>
  </main>

  <script>
    (function () {
      var INVITE = 'eh5fYWmZDxxhMjFi';
      var WEB = 'https://t.me/+' + INVITE;
      var APP = 'tg://join?invite=' + INVITE;
      var INTENT = 'intent://join?invite=' + INVITE +
        '#Intent;scheme=tg;package=org.telegram.messenger;S.browser_fallback_url=' +
        encodeURIComponent(WEB) + ';end';

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);

      // событие уходит в Umami, если счётчик загрузился; без него просто ничего не делает
      function track(name) {
        try { if (window.umami) window.umami.track(name, { platform: isAndroid ? 'android' : isIOS ? 'ios' : 'desktop' }); } catch (err) {}
      }

      document.getElementById('tg').addEventListener('click', function (e) {
        track('telegram-click');
        if (!isAndroid && !isIOS) return;   // на десктопе обычная ссылка работает как есть
        e.preventDefault();

        if (isAndroid) {
          window.location.href = INTENT;    // intent сам уведёт в Play Store, если Telegram не стоит
          return;
        }

        // iOS: пробуем приложение, через 1.2 с откатываемся на веб-версию
        var fallback = setTimeout(function () { window.location.href = WEB; }, 1200);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) clearTimeout(fallback);
        });
        window.location.href = APP;
      });

      var copy = document.getElementById('copy');
      copy.addEventListener('click', function () {
        track('copy-link');
        var done = function () { copy.textContent = 'Скопійовано ✓'; };
        if (navigator.clipboard) {
          navigator.clipboard.writeText(WEB).then(done, done);
        } else {
          var f = document.createElement('input');
          f.value = WEB;
          document.body.appendChild(f);
          f.select();
          document.execCommand('copy');
          document.body.removeChild(f);
          done();
        }
      });
    })();
  </script>
</body>
</html>
