<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Воздухан — Telegram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #eef4fb 0%, #dceaf7 100%);
      color: #16202c;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(20, 50, 90, .12);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #5b6b7c;
      margin-bottom: 24px;
    }

    .lead {
      font-weight: 600;
      color: #16202c;
      margin-bottom: 12px;
    }

    .list {
      list-style: none;
      display: inline-block;
      text-align: left;
      margin-bottom: 32px;
    }

    .list li {
      font-size: 16px;
      line-height: 1.9;
      color: #5b6b7c;
    }

    .list li::before {
      content: "▪️";
      margin-right: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #2aabee;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      padding: 15px 32px;
      border-radius: 999px;
      transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
      box-shadow: 0 8px 20px rgba(42, 171, 238, .35);
    }

    .btn:hover {
      background: #1d97d8;
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(42, 171, 238, .45);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(42, 171, 238, .35);
    }

    .btn svg { width: 22px; height: 22px; fill: currentColor; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Воздухан</h1>
    <p>Заробіток в інтернеті як він є — без рожевих окулярів.</p>

    <p class="lead">Що всередині:</p>
    <ul class="list">
      <li>арбітраж трафіку</li>
      <li>крипта</li>
      <li>кейси та особистий досвід</li>
    </ul>

    <a class="btn" href="https://t.me/+eh5fYWmZDxxhMjFi" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Перейти в телеграм
    </a>
  </main>
</body>
</html>
